name: Publish Windows update channel
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-update-channel
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'pc-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update verified Windows manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/update_windows_channel.py
